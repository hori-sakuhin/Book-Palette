<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">


</head>
<body id="loginbody">
    <main class="form-container">

        <h1>新規登録</h1>

        <form method="POST">

            <div class="form-group">
                <label for="username">ユーザー名:</label>
                <input type="text"
                    id="username"
                    name="username"
                    placeholder="例）山田太郎"
                    required>
            </div>

            <div class="form-group">
                <label for="email">メールアドレス:</label>
                <input type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password">パスワード:</label>
                <input type="password"
                    id="password"
                    name="password"
                    placeholder="英字+数字で8文字以上"
                    required>
            </div>

            <div class="form-group">
                <label for="confirm_password">パスワード確認:</label>
                <input type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="もう一度入力"
                    required>
            </div>

            <button class="btn" type="submit">
                登録
            </button>

        </form>

        <div class="form-link">
            <p>
                すでにアカウントをお持ちですか？
                <a href="{{ url_for('login') }}">ログイン</a>
            </p>
        </div>

    </main>
</body>
</html>
