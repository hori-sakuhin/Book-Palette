<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>図書検索</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body id="searchbody">

    <nav>
        <ul>
            <li><a href="{{ url_for('top') }}">ホーム画面</a></li>
            <li><a href="{{ url_for('search') }}">図書検索</a></li>
            <li><a href="{{ url_for('register_book') }}">おすすめ本を登録する</a></li>
            <li><a href="{{ url_for('other_recommend') }}">ほかのユーザーがおすすめした本</a></li>
            <li><a href="{{ url_for('mypage') }}">マイページ</a></li>
        </ul>
    </nav>

    <main>

        <h1>図書検索</h1>

        <form method="GET" action="{{ url_for('search') }}">
            <div class="book-actions">

                <input type="text" id="keyword" class="keyword" name="keyword" placeholder="タイトル・著者・ジャンルなど" value="{{ keyword or '' }}">

                <button type="submit">検索</button>
            </div>
        </form>

        <hr>

        <h2>検索結果</h2>

        {% if books %}

            <div class="book-list">

                {% for book in books %}

                    <article class="book-card">

                        <h3>{{ book.title }}</h3>

                        <div class="book-info">
                            <p>著者：{{ book.author }}</p>
                            <p>ジャンル：{{ book.genre }}</p>
                            <p>種類：{{ book.book_type }}</p>
                        </div>

                        <a class="btn"
                        href="{{ url_for('book_detail', book_id=book.book_id) }}">
                            詳細を見る
                        </a>

                    </article>

                {% endfor %}

            </div>
        {% else %}

            <p>検索結果がありません。</p>

        {% endif %}

    </main>

</body>
</html>
